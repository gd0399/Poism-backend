<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POIsim - AI Safety Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">POIsim</h1>
            <p class="text-xl text-gray-600">AI Safety and Jailbreak Detection System</p>
        </header>

        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-md p-6">
            <div class="mb-6">
                <label for="text-input" class="block text-gray-700 text-sm font-bold mb-2">Enter text to analyze:</label>
                <textarea id="text-input" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Enter your text here..."></textarea>
            </div>
            
            <button onclick="analyzeText()" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Analyze Text
            </button>

            <div id="results" class="mt-6 hidden">
                <h2 class="text-xl font-bold mb-4">Analysis Results</h2>
                <div class="space-y-4">
                    <div>
                        <span class="font-semibold">Safety Score:</span>
                        <span id="score" class="ml-2"></span>
                    </div>
                    <div>
                        <span class="font-semibold">Nature:</span>
                        <span id="nature" class="ml-2"></span>
                    </div>
                    <div>
                        <span class="font-semibold">Explanation:</span>
                        <p id="explanation" class="mt-1 text-gray-700"></p>
                    </div>
                    <div>
                        <span class="font-semibold">Status:</span>
                        <span id="status" class="ml-2"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function analyzeText() {
            const text = document.getElementById('text-input').value;
            if (!text) {
                alert('Please enter some text to analyze');
                return;
            }

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text }),
                });

                const data = await response.json();
                
                // Update results
                document.getElementById('score').textContent = data.score.toFixed(2);
                document.getElementById('nature').textContent = data.nature;
                document.getElementById('explanation').textContent = data.explanation;
                document.getElementById('status').textContent = data.is_safe ? '✅ Safe' : '⚠️ Potentially Unsafe';
                document.getElementById('status').className = data.is_safe ? 'text-green-500' : 'text-red-500';
                
                // Show results
                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                alert('Error analyzing text: ' + error.message);
            }
        }
    </script>
</body>
</html>
